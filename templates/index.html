<!DOCTYPE html>
<html>

<head>

    <title>UART Logger Dashboard</title>

    <style>

        body{
            font-family: Arial;
            margin: 20px;
            background: #f5f5f5;
        }

        h1{
            color: #333;
        }

        .device{
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        a{
            text-decoration: none;
            color: blue;
        }

        table{
            border-collapse: collapse;
            width: 100%;
            background: white;
        }

        th, td{
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th{
            background: #eaeaea;
        }

    </style>

</head>

<body>

<h1>UART Logger Dashboard</h1>

{% if devices %}

<h2>Connected Devices</h2>

{% for device in devices %}

<div class="device">

    <a href="/device/{{device}}">

        {{device}}

    </a>

</div>

{% endfor %}

{% endif %}

{% if rows %}

<h2>Logs : {{chip_id}}</h2>

<p>

<a href="/download/{{chip_id}}">
Download CSV
</a>

</p>

<table>

{% for row in rows %}

<tr>

{% for cell in row %}

<td>{{cell}}</td>

{% endfor %}

</tr>

{% endfor %}

</table>

{% endif %}

</body>
</html>
